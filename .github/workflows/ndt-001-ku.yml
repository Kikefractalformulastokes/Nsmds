name: NDT-001 KU Localization Benchmark
on:
  push:
    paths:
      - 'research/ndt-001-ku/**'
      - '.github/workflows/ndt-001-ku.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - name: Run frozen benchmark
        run: |
          mkdir -p research/ndt-001-ku/results
          set -o pipefail
          python research/ndt-001-ku/benchmark_ku.py | tee research/ndt-001-ku/results/run.log
      - name: Run lift-preserving challenger
        run: |
          mkdir -p research/ndt-001-ku/results_lift
          set -o pipefail
          python research/ndt-001-ku/benchmark_lift_preserving.py | tee research/ndt-001-ku/results_lift/run.log
      - name: Run M5 continuous localization gate
        run: |
          mkdir -p research/ndt-001-ku/results_continuous
          set -o pipefail
          python research/ndt-001-ku/benchmark_continuous.py | tee research/ndt-001-ku/results_continuous/run.log
      - name: Run M5B adaptive localization gate
        run: |
          mkdir -p research/ndt-001-ku/results_adaptive
          set -o pipefail
          python research/ndt-001-ku/benchmark_adaptive.py | tee research/ndt-001-ku/results_adaptive/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndt-001-ku-results
          path: |
            research/ndt-001-ku/results/
            research/ndt-001-ku/results_lift/
            research/ndt-001-ku/results_continuous/
            research/ndt-001-ku/results_adaptive/
